name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (GCC, Debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison ninja-build

      - name: Show tools
        run: |
          cmake --version
          ninja --version
          "$CXX" --version
          "$CC" --version
          flex --version
          yacc --version

      - name: Identify the runner image and the compiler
        id: platform
        # GitHub-hosted runners set ImageOS and ImageVersion.
        # -dumpversion alone prints only the major version with Ubuntu's GCC.
        run: |
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "compiler=$CC-$("$CC" -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"

      - name: Restore CUDD from the cache
        id: cudd-cache
        uses: actions/cache@v6
        with:
          path: ~/cudd
          key: cudd-${{ steps.platform.outputs.image }}-${{ steps.platform.outputs.compiler }}-${{ hashFiles('scripts/install-cudd.sh') }}

      - name: Install CUDD
        if: steps.cudd-cache.outputs.cache-hit != 'true'
        run: scripts/install-cudd.sh "$HOME/cudd"

      - name: Show CUDD
        run: find "$HOME/cudd" -type f | sort

      - name: Configure with BUILD_TESTING=OFF
        run: > 
          cmake -S . -B build-no-tests -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER="$CC"
          -DCMAKE_CXX_COMPILER="$CXX"
          -DCMAKE_PREFIX_PATH="$HOME/cudd"
          -DBUILD_TESTING=OFF

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER="$CC"
          -DCMAKE_CXX_COMPILER="$CXX"
          -DCMAKE_PREFIX_PATH="$HOME/cudd"

      - name: Build
        run: cmake --build build --parallel

      - name: Test (serial, known failures excluded)
        run: |
          # Baseline: 3fffec, 121 / 146. Remove a name when its issue is fixed.
          known_failures=(
            # #22: ltl2ba is looked up relative to the working directory
            FormulaTest.neverClaimOfComparisonFormula
            FormulaTest.neverClaimOfGloballyFormula
            FormulaTest.neverClaimOfNegatedFormula
            FormulaTest.neverClaimOfFinallyFormula
            FormulaTest.neverClaimOfComplexFormula
            FormulaCreatorTest.formulaStringToNeverClaim_Globally
            FormulaCreatorTest.formulaStringToNeverClaim_Finally
            FormulaCreatorTest.formulaStringToNeverClaim_Liveness
            LTLTransformerTest.formulaStringToNeverClaim_Globally
            LTLTransformerTest.formulaStringToNeverClaim_Finally
            LTLTransformerTest.formulaStringToNeverClaim_Liveness
            LTLTransformerTest.AppendNeverClaim_Globally
            LTLTransformerTest.AppendToNeverClaim_Finally
            LTLTransformerTest.AppendToNeverClaim_Liveness
            # #39: mutant-analysis assertions
            FormulaCreatorTest.groupStates_array
            FormulaCreatorTest.groupStates_flows
            FormulaCreatorTest.distinguishStates_flows
            SimilarityTest.KSuccessorsArray_Difference_ShouldBeEmpty
            TraceGeneratorTest.DiscardMutant_TrafficLight
            StateComparerTest.sameStatesArrayModel
            # #40: LTL properties reported as not satisfied
            LtlModelCheckerTest.ltlModelShouldBeSatisfied
            LtlModelCheckerTest.liveness1ShouldBeSatisfied
            # #41: SPIN is not installed
            SpinRunnerTest.TrafficLightModelIsCorrect
            SpinRunnerTest.ModelIsCorrect
            # #35: segfault
            TransitionTest.SampleNonUniformMultipleElements
          )
          pattern=$(printf '%s\n' "${known_failures[@]}" | sed 's/\./\\./g' | paste -sd '|')
          ctest --test-dir build --timeout 120 --output-on-failure \
                --no-tests=error \
                --exclude-regex "^(${pattern})\$"


      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            build/Testing/Temporary/
            build/compile_commands.json
